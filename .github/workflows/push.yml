name: Build and Push Docker Image

on:
  push:
    branches:
      - main

env:
    PackageName: rutracker-downloader

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      
      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.actor}}/$PackageName:latest ./app

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.actor}}/$PackageName:latest