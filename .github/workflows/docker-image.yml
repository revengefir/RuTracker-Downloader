name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Login
      run: echo "${{ secrets.GHCR_PASS }}" | docker login --username "${{ secrets. GHCR_USER }}" --password-stdin ghcr.io 
      
    - name: Build
      run: |
            docker build app --tag ghcr.io/revengefir/rutracker-downloader:$(date +%s) && docker push ghcr.io/revengefir/rutracker-downloader:$(date +%s)
